services:
  sentry:
    #image: sentry:latest
    build:
      context: "9.1"
      platforms:
        - "linux/amd64"
    depends_on:
      - redis
      - postgres
    ports:
      - 9000:9000
    command: run web -l debug
    environment:
      SENTRY_REDIS_HOST: redis
      SENTRY_POSTGRES_HOST: postgres
      SENTRY_SECRET_KEY: 123123123123
      SENTRY_SINGLE_ORGANIZATION: true
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: 123123qq

  redis:
    image: redis:6

  postgres:
    image: postgres:9
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: 123123qq
    volumes:
      - pg:/var/lib/postgresql/data

volumes:
  pg:
